<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e2ff"/>
      <stop offset="0.5" stop-color="#c9b8ff"/>
      <stop offset="1" stop-color="#f7c6f2"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="340" fill="url(#fade)"/></mask>
    <clipPath id="round"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="#0b0a16"/>
    <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridMask)"/>

    <ellipse cx="160" cy="40" rx="360" ry="220" fill="url(#glowA)">
      <animate attributeName="cx" values="160;260;160" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1080" cy="320" rx="380" ry="220" fill="url(#glowB)">
      <animate attributeName="cx" values="1080;960;1080" dur="14s" repeatCount="indefinite"/>
    </ellipse>

    <!-- badge -->
    <g transform="translate(80 72)">
      <rect width="232" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="18" cy="16" r="4" fill="#4ade80">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="21" font-size="14" fill="#d8d4ea">Acceptăm proiecte noi</text>
    </g>

    <text x="78" y="178" font-size="76" font-weight="800" letter-spacing="-2" fill="#ffffff">Vixon<tspan fill="url(#txt)"> Lab</tspan></text>
    <text x="82" y="222" font-size="24" fill="#b9b4cf">Site-uri rapide, cu design custom, rezervări și configuratoare,</text>
    <text x="82" y="254" font-size="24" fill="#b9b4cf">pentru afaceri locale care intră serios online.</text>

    <g transform="translate(82 280)">
      <rect width="148" height="36" rx="18" fill="url(#btn)"/>
      <text x="74" y="23" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">vixonlab.ro  →</text>
    </g>
    <text x="252" y="304" font-size="15" fill="#8b86a3">Râmnicu Vâlcea · Vixon Lab SRL</text>

    <!-- floating browser mockups -->
    <g transform="translate(830 70) rotate(-6)" opacity="0.95">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -8;0 0" dur="6s" repeatCount="indefinite"/>
      <rect width="290" height="180" rx="12" fill="#15132a" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="16" cy="14" r="4" fill="#ff5f57"/><circle cx="30" cy="14" r="4" fill="#febc2e"/><circle cx="44" cy="14" r="4" fill="#28c840"/>
      <rect x="16" y="40" width="150" height="14" rx="7" fill="url(#txt)" opacity="0.9"/>
      <rect x="16" y="64" width="210" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
      <rect x="16" y="80" width="180" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="16" y="104" width="84" height="22" rx="11" fill="url(#btn)"/>
      <rect x="16" y="140" width="80" height="26" rx="6" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="104" y="140" width="80" height="26" rx="6" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="192" y="140" width="80" height="26" rx="6" fill="#ffffff" fill-opacity="0.06"/>
    </g>
    <g transform="translate(960 150) rotate(5)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 8;0 0" dur="7s" repeatCount="indefinite"/>
      <rect width="150" height="120" rx="12" fill="#1b1836" stroke="#d946ef" stroke-opacity="0.35"/>
      <text x="16" y="28" font-size="12" fill="#b9b4cf">Rezervare</text>
      <rect x="16" y="40" width="118" height="16" rx="5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="16" y="62" width="118" height="16" rx="5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="16" y="88" width="118" height="20" rx="10" fill="url(#btn)"/>
      <text x="75" y="102" font-size="11" fill="#fff" text-anchor="middle">Confirmă</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
</svg>
